name: Build AI X-ray Windows EXE
on:
  push:
    branches: [main]
    paths:
      - "ai-xray-desktop/**"
      - ".github/workflows/ai-xray-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-xray-desktop/requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai-xray-desktop/requirements.txt
          python -m pip install "pyinstaller>=6.10,<7" "pytest>=8,<10"
      - name: Run tests
        shell: pwsh
        run: |
          python -m py_compile ai-xray-desktop/app.py
          python -m pytest ai-xray-desktop/tests -q
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AI-Xray-Inspection --distpath dist --workpath build --specpath build ai-xray-desktop/app.py
          if (!(Test-Path "dist/AI-Xray-Inspection.exe")) { throw "Executable missing" }
          if ((Get-Item "dist/AI-Xray-Inspection.exe").Length -lt 1000000) { throw "Executable too small" }
      - name: Smoke-launch GUI
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/AI-Xray-Inspection.exe" -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) { throw "GUI exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Xray-Inspection-Windows-x64
          path: dist/AI-Xray-Inspection.exe
          retention-days: 30
          if-no-files-found: error
  publish-preview:
    runs-on: ubuntu-latest
    needs: build-windows
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AI-Xray-Inspection-Windows-x64
          path: release
      - name: Publish preview Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          gh release create "ai-xray-v0.2-preview-${RUN}" release/AI-Xray-Inspection.exe --repo "${REPO}" --prerelease --title "AI X-ray Inspection v0.2 Preview ${RUN}" --notes "Experimental OpenCV analysis for 2D BGA solder, Void/Area/Shape and 10-ball peer comparison. Only verified RAW VGI+REC2. NOT trained Deep Learning or validated for production."
